name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags, to compare this one against

      # Re-pushing or patching an older release must not move the floating
      # image tags back: `latest` follows only the highest stable release,
      # and `X.Y` only the highest release in its X.Y line.
      - name: Decide floating tags
        id: floating
        run: |
          stable='^v[0-9]+\.[0-9]+\.[0-9]+$'
          tag="$GITHUB_REF_NAME"
          is_latest=false
          is_minor=false
          if [[ "$tag" =~ $stable ]]; then
            minor="${tag%.*}"
            highest=$(git tag -l 'v*' | grep -E "$stable" | sort -V | tail -n1)
            highest_minor=$(git tag -l "$minor.*" | grep -E "$stable" | sort -V | tail -n1)
            [ "$tag" = "$highest" ] && is_latest=true
            [ "$tag" = "$highest_minor" ] && is_minor=true
          fi
          echo "latest=$is_latest" >> "$GITHUB_OUTPUT"
          echo "minor=$is_minor" >> "$GITHUB_OUTPUT"
          echo "$tag: latest=$is_latest, major.minor=$is_minor"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=${{ steps.floating.outputs.latest }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.floating.outputs.minor }}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Baked into the binary (`pgwarden --version`); defaults to "dev".
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          platforms: linux/amd64,linux/arm64
